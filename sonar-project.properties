# SonarQube project config (spec 006 / T001). The reusable `quality` job feeds
# this to the self-hosted SonarQube server, which stays visibly skipped until
# the server exists (sonar-host-url empty). Coverage threshold is enforced there.
sonar.projectKey=MicroTodoSuite_auth-api
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go
sonar.exclusions=**/*_test.go

# Go coverage produced by ci/unit.sh.
sonar.go.coverage.reportPaths=coverage.out

# Business-logic coverage denominator excludes bootstrap (main.go) and infra
# (tracing.go) per research D2; the 70% gate applies to the remaining logic.
sonar.coverage.exclusions=main.go,tracing.go
