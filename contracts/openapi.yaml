openapi: 3.1.0
info:
  title: Auth API
  version: 1.0.0
  description: >
    Authenticates a small set of credentials, fetches the matching profile from
    the Users API, and returns a signed JWT. Contract-first source of truth
    (spec 007 / T007).
  contact:
    name: MicroTodoSuite
    url: https://github.com/MicroTodoSuite
  license:
    name: MIT
servers:
  - url: /
    description: Environment-neutral; routed by the frontend proxy / ingress.
paths:
  /login:
    post:
      operationId: login
      tags: [auth]
      summary: Exchange credentials for a signed JWT.
      description: Validates the credentials, fetches the user profile, and returns a signed access token.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated; returns an access token.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '401':
          description: Username or password is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Unexpected error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /version:
    get:
      operationId: getVersion
      tags: [meta]
      description: Returns a human-readable banner identifying the service.
      summary: Human-readable service version banner.
      responses:
        '200':
          description: Version banner.
          content:
            text/plain:
              schema:
                type: string
              example: "Auth API, written in Go\n"
  /health/startup:
    get:
      operationId: getStartupHealth
      tags: [observability]
      summary: Startup probe.
      description: >-
        Reports whether the process has finished starting. Kubernetes uses this
        to hold off the liveness probe until initialisation completes, so a slow
        start is not mistaken for a hang and restarted into a loop.
      responses:
        '200':
          description: Startup complete.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: Still starting.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /health/ready:
    get:
      operationId: getReadiness
      tags: [observability]
      summary: Readiness probe.
      description: >-
        Reports whether this pod should receive traffic right now. Failing this
        removes the pod from the Service endpoints without restarting it, which
        is what lets a pod drain connections cleanly.
      responses:
        '200':
          description: Ready to serve.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
        '503':
          description: Not ready to serve.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /health/live:
    get:
      operationId: getLiveness
      tags: [observability]
      summary: Liveness probe.
      description: >-
        Reports only whether the process is wedged. It deliberately does not
        consult users-api: a dependency outage must not restart every auth-api
        pod, which would turn a dependency incident into a full outage.
      responses:
        '200':
          description: Process is live.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HealthStatus' }
  /metrics:
    get:
      operationId: getMetrics
      tags: [observability]
      description: Exposes Prometheus metrics in text format; no authentication required.
      summary: Prometheus metrics exposition (public).
      responses:
        '200':
          description: Prometheus text exposition format.
          content:
            text/plain:
              schema:
                type: string
components:
  schemas:
    HealthStatus:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, starting, not-ready]
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
    LoginResponse:
      type: object
      required: [accessToken]
      properties:
        accessToken:
          type: string
          description: Signed JWT (HS256) carrying username/role claims.
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
tags:
  - name: auth
  - name: meta
  - name: observability
