name: ci

# Thin caller: all CI/CD logic lives in the org reusable workflows
# (MicroTodoSuite/.github). This repo declares only its identity and stack.
# Legacy Azure Container Apps deploy and static credentials were removed
# (roadmap task 4, spec 003).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: MicroTodoSuite/.github/.github/workflows/ci.yml@c9cd8d96c2c679b7c3c59fcede62084c40648f84
    with:
      service-name: auth-api
      language: go
      test-command: go test ./...
      source-audit-command: go mod verify && go vet ./...
      contract-command: npx --yes @stoplight/spectral-cli@6 lint contracts/openapi.yaml --ruleset .spectral.yaml
      ecr-repository: ${{ vars.AWS_ACCOUNT_ID }}.dkr.ecr.us-east-1.amazonaws.com/lex-mts-shd-ecr-authapi
      publisher-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/lex-mts-shd-role-ecrpublish
      sonar-project-key: MicroTodoSuite_auth-api
      sonar-host-url: ${{ vars.SONAR_HOST_URL }}
    secrets: inherit

  release:
    # Feature 005 owns the first shared-cluster release as one reviewed GitOps
    # activation. Keep legacy semantic-release opt-in until its token exists.
    if: ${{ github.event_name == 'push' && vars.ENABLE_LEGACY_SEMANTIC_RELEASE == 'true' }}
    needs: ci
    uses: MicroTodoSuite/.github/.github/workflows/release.yml@d0da1aefcc8affcd07087d6e0c2c6391b270001d
    secrets:
      release-app-id: ${{ secrets.RELEASE_APP_ID }}
      release-app-key: ${{ secrets.RELEASE_APP_KEY }}

  promote-dev:
    # Per-environment automation is intentionally disabled for the coordinated
    # dev/staging/prod activation required by feature 005.
    if: ${{ github.event_name == 'push' && vars.ENABLE_LEGACY_DEV_PROMOTION == 'true' && needs.release.outputs.released == 'true' }}
    needs: [ci, release]
    uses: MicroTodoSuite/.github/.github/workflows/promote.yml@a241b3b1e38e5d3efc6564806d72fc280a0c4fc6
    with:
      service-name: auth-api
      environment: dev
      image-digest: ${{ needs.ci.outputs.image-digest }}
      image-ref: ${{ needs.ci.outputs.image-ref }}
      publisher-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/lex-mts-shd-role-ecrpublish
    secrets:
      gitops-promote-app-id: ${{ secrets.GITOPS_PROMOTE_APP_ID }}
      gitops-promote-app-key: ${{ secrets.GITOPS_PROMOTE_APP_KEY }}

  promote-staging:
    # Same immutable digest promoted to staging after dev (build-once).
    if: ${{ github.event_name == 'push' && vars.ENABLE_LEGACY_DEV_PROMOTION == 'true' && needs.release.outputs.released == 'true' }}
    needs: [ci, release, promote-dev]
    uses: MicroTodoSuite/.github/.github/workflows/promote.yml@a241b3b1e38e5d3efc6564806d72fc280a0c4fc6
    with:
      service-name: auth-api
      environment: staging
      image-digest: ${{ needs.ci.outputs.image-digest }}
      image-ref: ${{ needs.ci.outputs.image-ref }}
      publisher-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/lex-mts-shd-role-ecrpublish
    secrets:
      gitops-promote-app-id: ${{ secrets.GITOPS_PROMOTE_APP_ID }}
      gitops-promote-app-key: ${{ secrets.GITOPS_PROMOTE_APP_KEY }}

  gate-prod:
    # Manual approval gate for production (configure required reviewers on the
    # GitHub "prod" environment in this repo, or this step will not pause).
    if: ${{ github.event_name == 'push' && vars.ENABLE_LEGACY_DEV_PROMOTION == 'true' && needs.release.outputs.released == 'true' }}
    needs: [promote-staging]
    runs-on: ubuntu-latest
    environment: prod
    steps:
      - run: echo "production promotion approved"

  promote-prod:
    # Same immutable digest promoted to prod after approval; ArgoCD rolls it out
    # as a canary with metric analysis (roadmap section 6).
    if: ${{ github.event_name == 'push' && vars.ENABLE_LEGACY_DEV_PROMOTION == 'true' && needs.release.outputs.released == 'true' }}
    needs: [ci, release, gate-prod]
    uses: MicroTodoSuite/.github/.github/workflows/promote.yml@a241b3b1e38e5d3efc6564806d72fc280a0c4fc6
    with:
      service-name: auth-api
      environment: prod
      image-digest: ${{ needs.ci.outputs.image-digest }}
      image-ref: ${{ needs.ci.outputs.image-ref }}
      publisher-role-arn: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/lex-mts-shd-role-ecrpublish
    secrets:
      gitops-promote-app-id: ${{ secrets.GITOPS_PROMOTE_APP_ID }}
      gitops-promote-app-key: ${{ secrets.GITOPS_PROMOTE_APP_KEY }}
