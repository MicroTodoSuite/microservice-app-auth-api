name: ci

# Thin caller: all CI/CD logic lives in the org reusable workflows
# (MicroTodoSuite/.github). This repo declares only its identity and stack.
# Legacy Azure Container Apps deploy and static credentials were removed
# (roadmap task 4, spec 003).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: MicroTodoSuite/.github/.github/workflows/ci.yml@e68d620ef0d14e7dd3d54e3f85eb035d84c25f41
    with:
      service-name: auth-api
      language: go
      test-command: go test ./...
      source-audit-command: go mod verify && go vet ./...
      contract-command: npx --yes @stoplight/spectral-cli@6 lint contracts/openapi.yaml --ruleset .spectral.yaml
      ecr-repository: 995253610162.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/auth-api
      publisher-role-arn: arn:aws:iam::995253610162:role/microtodosuite-github-ecr-publisher
      sonar-project-key: MicroTodoSuite_auth-api
      sonar-host-url: ${{ vars.SONAR_HOST_URL }}
    secrets: inherit

  release:
    # Feature 005 owns the first shared-cluster release as one reviewed GitOps
    # activation. Keep legacy semantic-release opt-in until its token exists.
    if: ${{ github.event_name == 'push' && vars.ENABLE_LEGACY_SEMANTIC_RELEASE == 'true' }}
    needs: ci
    uses: MicroTodoSuite/.github/.github/workflows/release.yml@e68d620ef0d14e7dd3d54e3f85eb035d84c25f41
    secrets:
      release-token: ${{ secrets.GH_TOKEN }}

  promote-dev:
    # Per-environment automation is intentionally disabled for the coordinated
    # dev/staging/prod activation required by feature 005.
    if: ${{ github.event_name == 'push' && vars.ENABLE_LEGACY_DEV_PROMOTION == 'true' && needs.release.outputs.released == 'true' }}
    needs: [ci, release]
    uses: MicroTodoSuite/.github/.github/workflows/promote.yml@e68d620ef0d14e7dd3d54e3f85eb035d84c25f41
    with:
      service-name: auth-api
      environment: dev
      image-digest: ${{ needs.ci.outputs.image-digest }}
      image-ref: ${{ needs.ci.outputs.image-ref }}
    secrets:
      gitops-app-id: ${{ secrets.GITOPS_PROMOTE_APP_ID }}
      gitops-app-key: ${{ secrets.GITOPS_PROMOTE_APP_KEY }}
