name: ci

# Thin caller: all CI/CD logic lives in the org reusable workflows
# (MicroTodoSuite/.github). This repo declares only its identity and stack.
# Legacy Azure Container Apps deploy and static credentials were removed
# (roadmap task 4, spec 003).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: MicroTodoSuite/.github/.github/workflows/ci.yml@0ea80036f4e92c32e24350c422b8d64d55da4a55
    with:
      service-name: auth-api
      language: go
      test-command: go test ./...
      source-audit-command: go mod verify && go vet ./...
      ecr-repository: 995253610162.dkr.ecr.us-east-1.amazonaws.com/microtodosuite/auth-api
      publisher-role-arn: arn:aws:iam::995253610162:role/microtodosuite-github-ecr-publisher
      sonar-project-key: MicroTodoSuite_auth-api
      sonar-host-url: ${{ vars.SONAR_HOST_URL }}
    secrets: inherit

  release:
    if: ${{ github.event_name == 'push' }}
    needs: ci
    uses: MicroTodoSuite/.github/.github/workflows/release.yml@0ea80036f4e92c32e24350c422b8d64d55da4a55
    secrets:
      release-token: ${{ secrets.GH_TOKEN }}

  promote-dev:
    if: ${{ github.event_name == 'push' && needs.release.outputs.released == 'true' }}
    needs: [ci, release]
    uses: MicroTodoSuite/.github/.github/workflows/promote.yml@0ea80036f4e92c32e24350c422b8d64d55da4a55
    with:
      service-name: auth-api
      environment: dev
      image-digest: ${{ needs.ci.outputs.image-digest }}
      image-ref: ${{ needs.ci.outputs.image-ref }}
    secrets:
      gitops-app-id: ${{ secrets.GITOPS_PROMOTE_APP_ID }}
      gitops-app-key: ${{ secrets.GITOPS_PROMOTE_APP_KEY }}
